server:
  port: 8288

spring:
  application:
    name: webtools-service-registry

eureka:
  instance:
    hostname: webtools-service-registry.onrender.com
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: https://webtools-test-service-registry.onrender.com/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
